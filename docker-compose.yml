version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./services/backend_api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./services/backend_api/.env
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  ai_service:
    build:
      context: ./services/ai_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./services/ai_service/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
