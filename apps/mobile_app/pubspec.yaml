name: mobile_app
description: AI-powered circular economy platform for college students
publish_to: 'none'
version: 2.0.0-rc1+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  dio: ^5.4.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.0.0
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.0.0
  google_sign_in: ^6.2.1
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.2
  skeletonizer: ^1.0.0
  flutter_svg: ^2.0.0
  lottie: ^3.0.0
  url_launcher: ^6.2.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
